plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pixerylabs.android.essentia'
    compileSdkVersion 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        versionName "1.1.1"

        ndkVersion "28.2.13676358"
        ndk {
            debugSymbolLevel = 'FULL'
            //noinspection ChromeOsAbiSupport
            abiFilters = ["arm64-v8a", "armeabi-v7a"]
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-21', '-DANDROID_TOOLCHAIN=clang', '-DANDROID_STL=c++_shared'
                cFlags '-O3'
                cppFlags '-Wall', '-O3', "-std=c++11", '-latomic', "-fPIC", "-DANDROID", '-DGTEST_HAS_TR1_TUPLE=0', '-DHAVE_EIGEN3=1', '-DEIGEN_PERMANENTLY_DISABLE_STUPID_WARNINGS', '-D__STDC_CONSTANT_MACROS', '-DEIGEN_MPL2_ONLY'
            }
        }
    }

    libraryVariants.configureEach { variant ->
        variant.outputs.all {
            outputFileName = "${project.name}-${variant.name}-${defaultConfig.versionName}.aar"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlin {
        jvmToolchain(21)
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
